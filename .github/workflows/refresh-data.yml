name: Refresh data

on:
  schedule:
    # Cíl: co nejdřív po 02:00 středoevropského času. GitHub cron jde jen v UTC a plánované běhy často startují
    # s hodinami zpoždění (v říjnu 2026 o 3 až 7 hodin), proto je spouštíme každou hodinu mezi 00:00 a 08:00 UTC
    # a krok "Gate" pustí první běh po 02:00 Praha, pokud dnes (pražský den) ještě neproběhl refresh.
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"
    - cron: "0 3 * * *"
    - cron: "0 5 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  # Gate je zvlášť a bez zámku. Kdyby byl ve stejné skupině jako refresh, druhý (prázdný) cron by ve frontě
  # vytlačil ten správný: GitHub drží ve frontě jen jeden čekající běh.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 200
      - name: Gate (první běh po 02:00 Praha, jednou denně)
        id: gate
        run: |
          hour=$(TZ=Europe/Prague date +%H)
          today=$(TZ=Europe/Prague date +%F)
          last=$(TZ=Europe/Prague git log -1 --grep='^data: denní refresh' --format=%cd --date=format-local:%F || true)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "ruční spuštění, běží"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$hour" -lt 2 ]; then
            echo "Praha $hour:xx, ještě není 02:00, přeskakuju"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$last" = "$today" ]; then
            echo "Dnešní refresh ($today) už proběhl, přeskakuju"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Praha $hour:xx, poslední refresh $last, spouštím"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Dva běhy najednou by si přepsaly stav katalogu v R2 (stejná skupina má League backfill).
    concurrency:
      group: refresh-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt boto3

      # Katalog (týmy, hráči, rozhodčí, historie) už není v gitu. Stav drží R2 (ft-public/catalog).
      # Denní skripty ho čtou a doplňují přírůstkově, proto se musí obnovit před nimi. Prázdný stav = chyba.
      - name: Stav katalogu z R2
        run: python scripts/r2_sync.py down frontend/public/data/catalog --bucket ft-public --prefix catalog --require-nonempty

      # Odpovědi SportMonks na disku. Když běh spadne nebo vyprší čas (první běh po zapnutí ligy je dlouhý),
      # další pokus je nevolá znovu a navazuje.
      - name: Cache API odpovědí
        uses: actions/cache/restore@v4
        with:
          path: scripts/.cache/api
          key: sm-api-daily-${{ github.run_id }}
          restore-keys: |
            sm-api-daily-

      - name: Daily refresh
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          PULSESCORE_API_TOKEN: ${{ secrets.PULSESCORE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/refresh_data.py

      # PitchAPI cache (stovky malých JSON) drží Actions cache, ne git. První běh ji naplní, další jen včerejší zápasy.
      - name: Restore PitchAPI cache
        uses: actions/cache/restore@v4
        with:
          path: scripts/.cache/pitchapi
          key: pitchapi-${{ github.run_id }}
          restore-keys: |
            pitchapi-

      # Katalog Chance Ligy + simulace všech 5 lig (sim-input v katalogu je přírůstkový, první běh ho jednou naplní).
      # Chyba tady nesmí zastavit commit dat ze SportMonks.
      - name: PitchAPI katalog + simulace (5 lig)
        continue-on-error: true
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: python scripts/pitch_daily.py

      # Signály pro rozcestník Match Center (ikonky, mini predikce). Čte jen uložené JSON, žádné API.
      - name: Signály pro výpis kola
        continue-on-error: true
        run: python scripts/round_signals.py

      # Vyhledávací index katalogu (jeden malý JSON z uložených dat, žádné API).
      - name: Vyhledávací index katalogu
        continue-on-error: true
        run: python scripts/catalog_search.py

      # Shardy zápasů hráčů + pooly pro pořadí (z uloženého players.json, žádné API).
      # Stránka hráče si stáhne jeden shard a jeden pool místo 8MB indexu.
      - name: Shardy a pooly hráčů
        continue-on-error: true
        run: python scripts/catalog_player_shards.py

      # Hráčské trendy pro Match Center (série střel a střel na bránu). Čte shardy výše, žádné API.
      - name: Hráčské trendy
        continue-on-error: true
        run: python scripts/player_trends.py

      # Kniha predikcí: před výkopem se zamkne predikce a kurz, po dohrání se doplní výsledek.
      # Musí běžet po výpočtu simulací (pitch_daily) a po doplnění explorer.json (refresh_data).
      # Bez API. Z ledgeru se pak skládá stránka Výsledky a automatické aktuality na homepage.
      - name: Kniha predikcí, výsledky, aktuality
        continue-on-error: true
        run: |
          python scripts/prediction_ledger.py
          python scripts/build_track_record.py
          python scripts/build_feed.py

      # Barvy týmů pro pruhy v Match Center. Přírůstkově: stahuje jen loga týmů, které ještě nemají barvu.
      - name: Barvy týmů z log
        continue-on-error: true
        run: |
          pip install pillow
          python scripts/build_team_colors.py

      # Běh trvá hodiny, mezitím může někdo pushnout do main. Proto před pushem rebase; při konfliktu
      # vyhrají čerstvá data z tohoto běhu (jsou celá přegenerovaná ze zdrojů).
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # leagues.json: refresh_data.py do něj doplňuje loga nově zapnutých lig, musí jít do commitu
          git add frontend/public/data scripts/config/leagues.json
          if git diff --cached --quiet; then
            echo "Žádná změna dat"
          else
            git commit -m "data: denní refresh"
            for i in 1 2 3 4; do
              if git pull --rebase --autostash -X theirs origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            echo "Push se nepodařil ani po opakování"
            exit 1
          fi

      # Až po commitu Match Center dat. Kdyby upload selhal, běh skončí chybou a nahraje se při dalším.
      - name: Katalog do R2
        run: python scripts/r2_sync.py up frontend/public/data/catalog --bucket ft-public --prefix catalog

      # Cache se ukládá i po neúspěšném běhu. První běh po zapnutí ligy je dlouhý a nesmí se při pádu
      # (např. při pushi) volat SportMonks znovu od nuly.
      - name: Uložit cache API odpovědí
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scripts/.cache/api
          key: sm-api-daily-${{ github.run_id }}

      - name: Uložit cache PitchAPI
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scripts/.cache/pitchapi
          key: pitchapi-${{ github.run_id }}
