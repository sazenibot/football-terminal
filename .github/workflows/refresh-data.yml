name: Refresh data

on:
  schedule:
    # Cíl: 02:00 středoevropského času. GitHub cron jde jen v UTC, tak spouštíme ve 00:00 i 01:00 UTC
    # a krok "Gate" nechá projít jen běh, který je v Praze právě v 02:xx (léto 00:00 UTC, zima 01:00 UTC).
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Dva běhy najednou by si přepsaly stav katalogu v R2.
concurrency:
  group: refresh-data
  cancel-in-progress: false

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Gate (02:00 Praha)
        id: gate
        run: |
          hour=$(TZ=Europe/Prague date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "02" ]; then
            echo "Praha $hour:xx, tohle není 02:00, přeskakuju"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install deps
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt boto3

      # Katalog (týmy, hráči, rozhodčí, historie) už není v gitu. Stav drží R2 (ft-public/catalog).
      # Denní skripty ho čtou a doplňují přírůstkově, proto se musí obnovit před nimi. Prázdný stav = chyba.
      - name: Stav katalogu z R2
        if: steps.gate.outputs.run == 'true'
        run: python scripts/r2_sync.py down frontend/public/data/catalog --bucket ft-public --prefix catalog --require-nonempty

      - name: Daily refresh
        if: steps.gate.outputs.run == 'true'
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          PULSESCORE_API_TOKEN: ${{ secrets.PULSESCORE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/refresh_data.py

      # PitchAPI cache (stovky malých JSON) drží Actions cache, ne git. První běh ji naplní, další jen včerejší zápasy.
      - name: Restore PitchAPI cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: scripts/.cache/pitchapi
          key: pitchapi-${{ github.run_id }}
          restore-keys: |
            pitchapi-

      # Jen Chance Liga (262). Chyba tady nesmí zastavit commit dat ze SportMonks.
      - name: PitchAPI katalog + simulace (Chance Liga)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: python scripts/pitch_daily.py

      # Signály pro rozcestník Match Center (ikonky, mini predikce). Čte jen uložené JSON, žádné API.
      - name: Signály pro výpis kola
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/round_signals.py

      # Vyhledávací index katalogu (jeden malý JSON z uložených dat, žádné API).
      - name: Vyhledávací index katalogu
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/catalog_search.py

      # Shardy zápasů hráčů + pooly pro pořadí (z uloženého players.json, žádné API).
      # Stránka hráče si stáhne jeden shard a jeden pool místo 8MB indexu.
      - name: Shardy a pooly hráčů
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/catalog_player_shards.py

      # Kniha predikcí: před výkopem se zamkne predikce a kurz, po dohrání se doplní výsledek.
      # Musí běžet po výpočtu simulací (pitch_daily) a po doplnění explorer.json (refresh_data).
      # Bez API. Z ledgeru se pak skládá stránka Výsledky a automatické aktuality na homepage.
      - name: Kniha predikcí, výsledky, aktuality
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          python scripts/prediction_ledger.py
          python scripts/build_track_record.py
          python scripts/build_feed.py

      # Barvy týmů pro pruhy v Match Center. Přírůstkově: stahuje jen loga týmů, které ještě nemají barvu.
      - name: Barvy týmů z log
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          pip install pillow
          python scripts/build_team_colors.py

      - name: Commit data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data
          if git diff --cached --quiet; then
            echo "Žádná změna dat"
          else
            git commit -m "data: denní refresh"
            git push
          fi

      # Až po commitu Match Center dat. Kdyby upload selhal, běh skončí chybou a nahraje se při dalším.
      - name: Katalog do R2
        if: steps.gate.outputs.run == 'true'
        run: python scripts/r2_sync.py up frontend/public/data/catalog --bucket ft-public --prefix catalog
