name: Refresh data

on:
  schedule:
    # Cíl: 02:00 středoevropského času. GitHub cron jde jen v UTC, tak spouštíme ve 00:00 i 01:00 UTC
    # a krok "Gate" nechá projít jen běh, který je v Praze právě v 02:xx (léto 00:00 UTC, zima 01:00 UTC).
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Gate (02:00 Praha)
        id: gate
        run: |
          hour=$(TZ=Europe/Prague date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "02" ]; then
            echo "Praha $hour:xx, tohle není 02:00, přeskakuju"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install deps
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Daily refresh
        if: steps.gate.outputs.run == 'true'
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          PULSESCORE_API_TOKEN: ${{ secrets.PULSESCORE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/refresh_data.py

      # PitchAPI cache (stovky malých JSON) drží Actions cache, ne git. První běh ji naplní, další jen včerejší zápasy.
      - name: Restore PitchAPI cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: scripts/.cache/pitchapi
          key: pitchapi-${{ github.run_id }}
          restore-keys: |
            pitchapi-

      # Jen Chance Liga (262). Chyba tady nesmí zastavit commit dat ze SportMonks.
      - name: PitchAPI katalog + simulace (Chance Liga)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: python scripts/pitch_daily.py

      # Signály pro rozcestník Match Center (ikonky, mini predikce). Čte jen uložené JSON, žádné API.
      - name: Signály pro výpis kola
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/round_signals.py

      - name: Commit data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data
          if git diff --cached --quiet; then
            echo "Žádná změna dat"
          else
            git commit -m "data: denní refresh"
            git push
          fi
