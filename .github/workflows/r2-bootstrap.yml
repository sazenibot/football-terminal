name: R2 bootstrap

# Jednorázové (a bezpečně opakovatelné) nahrání katalogu z gitu do R2 bucketu ft-public.
# Nic nemaže, nahrává jen nové a změněné soubory. Spouští se ručně z karty Actions.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install boto3

      - name: Katalog do R2 (ft-public/catalog)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/r2_sync.py up frontend/public/data/catalog --bucket ft-public --prefix catalog
