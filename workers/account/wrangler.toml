name = "ft-account"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Lokálně: `npm run migrate` a `npm run dev`.
# Produkce: `npx wrangler deploy --env production`
# DATA_ORIGIN musí číst surová JSON mimo Worker route (přes /__raw/data na Pages).
# Stripe: secrets STRIPE_SECRET_KEY a STRIPE_WEBHOOK_SECRET (wrangler secret put).
# Produkty: `npm run stripe:setup`. Na starší D1 bez sloupce: `npm run migrate:billing`.

[triggers]
crons = ["0 5 1 6 *", "0 5 1 8 *"]

[[d1_databases]]
binding = "DB"
database_name = "ft-account"
database_id = "950b2fec-aec4-4c34-99e2-2333bd3ce6e9"

[vars]
ENVIRONMENT = "development"
SITE_URL = "http://127.0.0.1:5173"
DATA_ORIGIN = "http://127.0.0.1:5173"
MAIL_FROM = "Football Terminal <noreply@football-terminal.com>"

[env.production]
name = "ft-account"
workers_dev = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "ft-account"
database_id = "950b2fec-aec4-4c34-99e2-2333bd3ce6e9"

[env.production.triggers]
crons = ["0 5 1 6 *", "0 5 1 8 *"]

[env.production.vars]
ENVIRONMENT = "production"
SITE_URL = "https://football-terminal.com"
DATA_ORIGIN = "https://football-terminal.com"
MAIL_FROM = "Football Terminal <noreply@football-terminal.com>"

[[env.production.routes]]
pattern = "football-terminal.com/api/*"
zone_name = "football-terminal.com"

[[env.production.routes]]
pattern = "football-terminal.com/data/matches/*"
zone_name = "football-terminal.com"

[[env.production.routes]]
pattern = "football-terminal.com/data/sim/*"
zone_name = "football-terminal.com"

[[env.production.routes]]
pattern = "football-terminal.com/data/upcoming.json"
zone_name = "football-terminal.com"

[[env.production.routes]]
pattern = "football-terminal.com/data/leagues/*"
zone_name = "football-terminal.com"
